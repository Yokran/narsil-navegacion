# Construye los cuatro ejecutables de NARSIL Navegación, cada uno en un runner de su sistema y
# arquitectura, los adjunta a la Release de la etiqueta y publica SHA256SUMS con la suma de
# cada uno: el actualizador de la app no instala nada cuya suma no coincida con ese fichero.
# Se dispara al empujar una etiqueta `v*` (o a mano desde la pestaña Actions).
#
# Las acciones van fijadas por SHA de commit, no por etiqueta móvil: una etiqueta se puede
# mover; un SHA, no. Al subir de versión, cambiar el SHA y el comentario a la vez.
#
# Los runners ARM (ubuntu-24.04-arm, windows-11-arm) son los que GitHub ofrece para
# repositorios públicos; si alguno no estuviera disponible en la cuenta, basta con quitar esa
# fila de la matriz y construir ese ejecutable a mano con empaquetado/construir.*.
name: Construir ejecutables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditoria:
    name: Dependencias (pip-audit y npm audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020    # v4
        with:
          node-version: "22"
      - name: pip-audit
        run: |
          python -m pip install --quiet pip-audit
          python -m pip_audit -r backend/requirements.txt -r empaquetado/requirements-build.txt
      - name: npm audit
        run: npm ci && npm audit --audit-level=high
        working-directory: ui

  construir:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: windows-x86_64
            runner: windows-latest
            artefacto: "dist/NARSIL Navegacion-windows-x86_64.exe"
          - nombre: windows-arm64
            runner: windows-11-arm
            artefacto: "dist/NARSIL Navegacion-windows-arm64.exe"
          - nombre: linux-x86_64
            runner: ubuntu-24.04
            artefacto: "dist/narsil-navegacion-linux-x86_64"
          - nombre: linux-aarch64
            runner: ubuntu-24.04-arm
            artefacto: "dist/narsil-navegacion-linux-aarch64"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020    # v4
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Interfaz
        run: npm ci && npm run build
        working-directory: ui

      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Construir (Linux)
        if: runner.os == 'Linux'
        run: bash empaquetado/construir.sh

      - name: Construir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File empaquetado\construir.ps1

      - name: Comprobar que arranca sin ventana
        shell: bash
        run: |
          set -e
          EXE="${{ matrix.artefacto }}"
          "$EXE" --sin-ventana &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8420/api/status; then echo; break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8420/api/status | grep -q '"app":"narsil-navegacion"'
          curl -sf http://127.0.0.1:8420/api/status | grep -q '"packaged":true'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.artefacto }}
          if-no-files-found: error

  publicar:
    name: Release con sumas SHA-256
    needs: construir
    # Si una pata de la matriz falla (un runner ARM no disponible), la Release sale igual con
    # las que hayan construido; la que falta se construye a mano y se adjunta.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Sumas
        run: |
          cd artefactos
          ls -la
          sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            artefactos/*
          fail_on_unmatched_files: true
          generate_release_notes: true
